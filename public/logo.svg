<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="textlab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a79d0" />
      <stop offset="100%" stop-color="#5c4c9a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#403265" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#textlab-grad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Center Character '字' stylised -->
  <text x="256" y="328" text-anchor="middle" font-family="'DM Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif" font-weight="900" font-size="250" fill="#ffffff" letter-spacing="-0.02em">字</text>
  
  <!-- Top-Right Sparkle Accent ✦ -->
  <path d="M 370 120 Q 370 150 400 150 Q 370 150 370 180 Q 370 150 340 150 Q 370 150 370 120 Z" fill="#ffd778" />
</svg>
