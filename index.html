    <style>
      :root {
        --ink: #1d1d1f;
        --canvas: #f5f5f7;
        --paper: #ffffff;
        --purple: #6e56cf;
        --line: #e5e5ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f7;
          --canvas: #000000;
          --paper: #1c1c1e;
          --purple: #9d8bf0;
          --line: #2c2c2e;
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Noto Sans TC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      /* 搜尋引擎爬蟲無障礙可讀，但對人類視覺完全隱藏，杜絕文字閃跳 (Zero FOUC) */
      .seo-fallback {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      /* Apple 原生骨架屏 (0 延遲秒開視覺) */
      .app-skeleton {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 20px;
        box-sizing: border-box;
      }
      .skeleton-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 52px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }
      .skeleton-logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .skeleton-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--purple);
        opacity: 0.85;
      }
      .skeleton-title {
        width: 64px;
        height: 16px;
        border-radius: 4px;
        background: var(--line);
      }
      .skeleton-actions {
        display: flex;
        gap: 8px;
      }
      .skeleton-pill {
        width: 58px;
        height: 30px;
        border-radius: 8px;
        background: var(--line);
      }
      .skeleton-main {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 24px;
      }
      @media (max-width: 768px) {
        .skeleton-main {
          grid-template-columns: 1fr;
        }
        .skeleton-sidebar {
          display: none;
        }
      }
      .skeleton-sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .skeleton-bar {
        height: 36px;
        border-radius: 8px;
        background: var(--paper);
        border: 1px solid var(--line);
      }
      .skeleton-content {
        flex: 1;
      }
      .skeleton-card {
        height: 440px;
        border-radius: 14px;
        background: var(--paper);
        border: 1px solid var(--line);
      }
    </style>

            s.async = true;

            document.head.appendChild(s);
            gtag("config", savedGaId, { send_page_view: false });
          }
        } catch {}
      });
    </script>
